name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo test --manifest-path crates/domain/Cargo.toml
      - run: bash scripts/check-dependencies.sh
      - run: node --test scripts/check-dependencies.test.mjs
      - run: npm ci --include=dev
      - run: npm run verify:stage1

  release-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.100
      - run: bash scripts/build-web.sh
      - run: cargo build --locked --release -p server

  browser-smoke:
    runs-on: ubuntu-latest
    needs: [quality, release-build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.100
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/build-web.sh
      - name: Run browser smoke
        run: |
          cargo run --locked --release -p server &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npm run smoke

  docker-build:
    runs-on: ubuntu-latest
    needs: [quality, release-build, browser-smoke]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag my-retirement-calculator:ci .
