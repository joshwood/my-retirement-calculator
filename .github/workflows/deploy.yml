name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo test --manifest-path crates/domain/Cargo.toml
      - run: bash scripts/check-dependencies.sh
      - run: node --test scripts/check-dependencies.test.mjs
      - run: npm ci --include=dev

  release-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.100
      - run: bash scripts/build-web.sh
      - run: cargo build --locked --release -p server

  publish:
    runs-on: ubuntu-latest
    needs: [quality, release-build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/joshwood/my-retirement-calculator:latest
            ghcr.io/joshwood/my-retirement-calculator:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: my-retirement-calculator
          docker-compose-path: docker-compose.yml
          environment-variables: IMAGE_TAG=${{ github.sha }}
      - name: Verify production health
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 \
              https://my-retirement-calculator.srv2019569.hstgr.cloud/health >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done
          echo "Production health check failed after 12 attempts" >&2
          exit 1
