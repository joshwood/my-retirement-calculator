[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/api-contract",
    "crates/adapters-memory",
    "apps/server",
    "apps/web",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
adapters-memory = { path = "crates/adapters-memory", version = "=0.1.0" }
api-contract = { path = "crates/api-contract", version = "=0.1.0" }
application = { path = "crates/application", version = "=0.1.0" }
axum = "=0.8.4"
domain = { path = "crates/domain", version = "=0.1.0" }
http = "=1.3.1"
leptos = { version = "=0.7.8", default-features = false }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tokio = { version = "=1.45.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "=0.5.2", features = ["util"] }
tower-http = { version = "=0.6.6", features = ["fs", "limit", "request-id", "set-header"] }
uuid = { version = "=1.16.0", features = ["v4"] }
wasm-bindgen = "=0.2.100"
wasm-bindgen-test = "=0.3.50"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
